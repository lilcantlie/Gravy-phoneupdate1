<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <title>Gravy's iPhone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="stage">
    <div id="phone" data-state="lock">
      <i id="btn-action"></i><i id="btn-volup"></i><i id="btn-voldown"></i>
      <i id="btn-side" title="Kunci layar"></i>

      <div id="screen">
        <!-- Home screen (dibuat oleh app.js) -->
        <div id="home" class="layer"></div>
        <!-- Layar aplikasi (dibuat oleh app.js) -->
        <div id="apps" class="layer"></div>

        <!-- Lock screen -->
        <div id="lock" class="layer">
          <div class="lock-bg"></div>
          <div class="lock-content">
            <div class="lock-date" id="lock-date"></div>
            <div class="lock-time" id="lock-time"></div>
            <div class="lock-notifs" id="lock-notifs"></div>
          </div>
          <div class="lock-bottom">
            <button class="lock-btn" aria-label="Senter" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 2h8v3l-1.5 2.2V22a1 1 0 0 1-1 1h-3a1 1 0 0 1-1-1V7.2L8 5V2zm4 6.5a1.25 1.25 0 1 0 0 2.5 1.25 1.25 0 0 0 0-2.5z"/></svg>
            </button>
            <div class="swipe-hint" id="swipe-hint">Swipe up to open</div>
            <button class="lock-btn" aria-label="Kamera" tabindex="-1">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3H9zm3 5.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z"/></svg>
            </button>
          </div>
        </div>

        <!-- Passcode -->
        <div id="passcode" class="layer">
          <div class="pc-inner">
            <div class="pc-title" id="pc-title">Enter Passcode</div>
            <div class="pc-dots" id="pc-dots"><i></i><i></i><i></i><i></i></div>
            <div class="pc-pad" id="pc-pad"></div>
            <div class="pc-foot"><span>Emergency</span><span id="pc-cancel">Cancel</span></div>
          </div>
        </div>

        <!-- Status bar, dynamic island, home indicator -->
        <div id="statusbar">
          <div class="sb-left"><span id="sb-time">00:00</span></div>
          <div class="sb-right">
            <svg id="sb-signal" viewBox="0 0 19 12" width="19" height="12"><rect x="0" y="8" width="3.2" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3.2" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3.2" height="12" rx="1" fill="#fff"/></svg>
            <svg id="sb-wifi" viewBox="0 0 17 12" width="17" height="12" fill="#fff"><path d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1-1A10.3 10.3 0 0 0 8.5.9C5.8.9 3.3 2 1.3 3.8l1 1a8.9 8.9 0 0 1 6.2-2.5z"/><path d="M8.5 5.6c1.5 0 2.8.6 3.9 1.5l1-1a7.2 7.2 0 0 0-9.8 0l1 1c1.1-.9 2.4-1.5 3.9-1.5z"/><path d="M8.5 8.8c.7 0 1.3.3 1.8.7L8.5 11.4 6.7 9.5c.5-.4 1.1-.7 1.8-.7z"/></svg>
            <svg id="sb-batt" viewBox="0 0 28 13" width="28" height="13"><rect x=".5" y=".5" width="23" height="12" rx="3.6" fill="none" stroke="#fff" opacity=".45"/><rect id="sb-batt-fill" x="2" y="2" width="20" height="9" rx="2.4" fill="#fff"/><path d="M25 4.5v4c.9-.3 1.6-1.1 1.6-2s-.7-1.7-1.6-2z" fill="#fff" opacity=".5"/></svg>
          </div>
        </div>
        <div id="island"><i></i></div>
        <div id="homebar"><b></b></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
